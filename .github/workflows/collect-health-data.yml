name: Coletar dados de saúde
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-health-data.py
      - uses: actions/upload-artifact@v4
        with:
          name: dados-de-saude-para-revisao
          path: |
            public/data/health-units/
            src/shared/data/publishedCities.json
          retention-days: 14
